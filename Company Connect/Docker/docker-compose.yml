services:
  companyconnect-api:
    build: 
      context: ..
      dockerfile: Docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      ASPNETCORE_ENVIRONMENT: dev
      ASPNETCORE_HTTP_PORTS: 3000
    depends_on:
      - companyconnect-sql-dev
    secrets:
      - db_connection_string
    entrypoint:
      - /bin/sh
      - -c
      - |
        export ConnectionStrings__SqlServer="$$(cat /run/secrets/db_connection_string)"
        exec dotnet CompanyConnect.WebApi.dll
  companyconnect-sql-dev:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    volumes:
    - volume-companyconnect-sql-dev:/var/opt/mssql
    secrets:
      - sql_password
    entrypoint:
      - /bin/bash
      - -c
      - |
        export MSSQL_SA_PASSWORD="$$(cat /run/secrets/sql_password)"
        exec /opt/mssql/bin/sqlservr
    restart: unless-stopped
volumes:
  volume-companyconnect-sql-dev:
    external: true
secrets:
  sql_password:
    file: ./sql_password.txt
  db_connection_string:
    file: ./connection_string.txt